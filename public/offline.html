<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <meta name="theme-color" content="#06070b"/>
  <title>SunoDown · Offline</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#06070b;color:#f7f8fb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:24px}
    main{width:min(420px,100%);text-align:center}.logo{width:78px;height:78px;margin:0 auto 20px;border-radius:24px;display:grid;place-items:center;background:linear-gradient(145deg,#8b5cf6,#d946ef 55%,#22d3ee);font-size:38px;box-shadow:0 24px 70px rgba(139,92,246,.22)}
    h1{font-size:28px;letter-spacing:-.04em;margin:0}p{color:#8793a7;line-height:1.6;font-size:14px;margin:12px 0 22px}
    button{border:0;border-radius:999px;background:#fff;color:#090b10;padding:12px 18px;font-weight:800;font-size:14px}
  </style>
</head>
<body>
  <main>
    <div class="logo">♪</div>
    <h1>Bạn đang offline</h1>
    <p>SunoDown cần mạng để tải bài hát, Music và Creator Studio. Kết nối lại rồi thử tiếp.</p>
    <button onclick="location.reload()">Thử lại</button>
  </main>
</body>
</html>
