name: Install SunoDown Mobile Icon Once

on:
  push:
    branches: [v17]
    paths:
      - '.github/workflows/install-mobile-icon-once.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install icon and update Expo config
        run: |
          mkdir -p apps/mobile/assets
          cat > /tmp/icon.b64 <<'EOF'
[...truncated...]
EOF
          base64 -d /tmp/icon.b64 > apps/mobile/assets/icon.png
          python - <<'PY'
          import json
          p='apps/mobile/app.json'
          data=json.load(open(p))
          expo=data['expo']
          expo['icon']='./assets/icon.png'
          expo.setdefault('android',{})['adaptiveIcon']={
            'foregroundImage':'./assets/icon.png',
            'backgroundColor':'#070B14'
          }
          with open(p,'w') as f:
            json.dump(data,f,ensure_ascii=False,indent=2)
            f.write('\n')
          PY
          git rm .github/workflows/install-mobile-icon-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/mobile/assets/icon.png apps/mobile/app.json
          git commit -m "v17: add SunoDown mobile app icon"
          git push
