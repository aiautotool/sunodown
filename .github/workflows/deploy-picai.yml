name: Deploy picai.online domains

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: picai-domains-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Provision shared Cloudflare resources
        run: node scripts/provision-v6-cloudflare.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Add picai Custom Domains to generated config
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = 'wrangler.v6.generated.json';
          const cfg = JSON.parse(fs.readFileSync(path, 'utf8'));
          cfg.routes ||= [];
          const remove = new Set([
            'picai.online',
            'picai.online/*',
            'www.picai.online',
            'www.picai.online/*'
          ]);
          cfg.routes = cfg.routes.filter((route) => {
            const pattern = typeof route === 'string' ? route : route?.pattern;
            return !remove.has(pattern);
          });
          cfg.routes.push(
            { pattern: 'picai.online', custom_domain: true },
            { pattern: 'www.picai.online', custom_domain: true }
          );
          fs.writeFileSync(path, JSON.stringify(cfg, null, 2));
          NODE

      - name: Deploy Worker and let Cloudflare create DNS
        run: npx wrangler deploy --config wrangler.v6.generated.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Verify public DNS
        run: |
          set -euo pipefail
          ok=0
          for attempt in 1 2 3 4 5 6; do
            ok=1
            for host in picai.online www.picai.online; do
              echo "=== $host attempt $attempt ==="
              if ! nslookup "$host" 1.1.1.1; then ok=0; fi
              if ! nslookup "$host" 8.8.8.8; then ok=0; fi
            done
            if [ "$ok" -eq 1 ]; then
              exit 0
            fi
            sleep 10
          done
          echo "Public DNS did not resolve after deploy."
          exit 1
