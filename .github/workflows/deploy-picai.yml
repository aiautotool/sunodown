name: Deploy picai.online

on:
  push:
    branches: [v20.1]
    paths:
      - '.github/workflows/deploy-picai.yml'
      - 'scripts/prepare-picai-domain.mjs'
      - 'scripts/restore-picai-domain.mjs'
      - 'wrangler.jsonc'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: picai-online-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Provision shared Cloudflare resources
        run: node scripts/provision-v6-cloudflare.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Backup and release picai.online apex DNS
        run: node scripts/prepare-picai-domain.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PICAI_DOMAIN: picai.online

      - name: Deploy Worker to picai.online
        run: npx wrangler deploy --config wrangler.v6.generated.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Restore original picai.online DNS after failure
        if: failure()
        run: node scripts/restore-picai-domain.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
