name: Repair picai.online Worker domains

on:
  push:
    branches: [v20.1]
    paths:
      - '.github/workflows/deploy-picai.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: picai-domain-repair
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Provision shared Cloudflare resources
        run: node scripts/provision-v6-cloudflare.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy Worker without picai route mutation
        run: npx wrangler deploy --config wrangler.v6.generated.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Attach picai Worker domains via Domains API
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 2de679b502c90e736abad750fd0415f7
          CLOUDFLARE_ZONE_ID: e655c86fa8ded678787759daa263ac8e
        run: |
          set -euo pipefail
          for host in picai.online www.picai.online; do
            response="$(curl -sS -X PUT               "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains"               -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"               -H "Content-Type: application/json"               --data "{\"hostname\":\"$host\",\"service\":\"suno-aiautotool\",\"zone_id\":\"$CLOUDFLARE_ZONE_ID\",\"zone_name\":\"picai.online\"}")"
            echo "$response" | jq '{success, errors, result: (.result | if . then {id, hostname, service, zone_id, zone_name} else null end)}'
            echo "$response" | jq -e '.success == true' >/dev/null
          done

      - name: Verify domain associations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 2de679b502c90e736abad750fd0415f7
        run: |
          set -euo pipefail
          response="$(curl -sS             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains"             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             -H "Content-Type: application/json")"
          echo "$response" | jq '[.result[] | select(.hostname=="picai.online" or .hostname=="www.picai.online") | {id,hostname,service,zone_id,zone_name}]'
          test "$(echo "$response" | jq '[.result[] | select((.hostname=="picai.online" or .hostname=="www.picai.online") and .service=="suno-aiautotool")] | length')" -eq 2

      - name: Verify HTTPS reaches Worker
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            all_ok=1
            for url in https://picai.online https://www.picai.online; do
              status="$(curl -sS -o /tmp/picai-body -w '%{http_code}' --max-time 20 "$url" || echo 000)"
              echo "$url -> HTTP $status"
              case "$status" in
                2*|3*|4*) ;;
                *) all_ok=0 ;;
              esac
            done
            if [ "$all_ok" -eq 1 ]; then exit 0; fi
            sleep 5
          done
          exit 1
