name: Deploy www.picai.online

on:
  push:
    branches: [v20.1]
    paths:
      - '.github/workflows/deploy-picai.yml'
      - 'wrangler.jsonc'
      - 'worker-v6.ts'
      - 'app/**'
      - 'components/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: www-picai-online-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Provision shared Cloudflare resources
        run: node scripts/provision-v6-cloudflare.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Upload current Worker
        run: npx wrangler deploy --config wrangler.v6.generated.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Attach picai.online and www.picai.online to Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 2de679b502c90e736abad750fd0415f7
        run: |
          set -euo pipefail
          for host in picai.online www.picai.online; do
            response="$(curl -sS -X PUT "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" --data "{\"hostname\":\"$host\",\"service\":\"suno-aiautotool\"}")"
            echo "$response" | jq '{success, errors, result: (.result | if . then {hostname, service, zone_name, id} else null end)}'
            echo "$response" | jq -e '.success == true' >/dev/null
          done

      - name: Restore public DNS for Worker domains
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: e655c86fa8ded678787759daa263ac8e
        run: |
          set -euo pipefail
          for host in picai.online www.picai.online; do
            existing="$(curl -sS "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/dns_records?type=A&name=$host"               -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"               -H "Content-Type: application/json")"
            echo "$existing" | jq '{success, errors, count: (.result | length)}'
            echo "$existing" | jq -e '.success == true' >/dev/null
            record_id="$(echo "$existing" | jq -r '.result[0].id // empty')"
            payload="{\"type\":\"A\",\"name\":\"$host\",\"content\":\"192.0.2.1\",\"ttl\":1,\"proxied\":true,\"comment\":\"Worker custom domain DNS anchor\"}"
            if [ -n "$record_id" ]; then
              response="$(curl -sS -X PUT "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/dns_records/$record_id"                 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"                 -H "Content-Type: application/json"                 --data "$payload")"
            else
              response="$(curl -sS -X POST "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/dns_records"                 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"                 -H "Content-Type: application/json"                 --data "$payload")"
            fi
            echo "$response" | jq '{success, errors, result: (.result | if . then {id,type,name,content,proxied} else null end)}'
            echo "$response" | jq -e '.success == true' >/dev/null
          done

      - name: Verify Worker domains and public DNS
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 2de679b502c90e736abad750fd0415f7
        run: |
          set -euo pipefail
          echo "=== Worker Domains ==="
          curl -sS             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains"             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             -H "Content-Type: application/json"             | jq '.result[] | select(.hostname=="picai.online" or .hostname=="www.picai.online")'
          echo "=== Public DNS ==="
          for host in picai.online www.picai.online; do
            echo "--- $host ---"
            nslookup "$host" 1.1.1.1 || true
            nslookup "$host" 8.8.8.8 || true
          done
