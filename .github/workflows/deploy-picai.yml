name: Deploy picai.online routes

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: picai-domains-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Provision shared Cloudflare resources
        run: node scripts/provision-v6-cloudflare.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Add picai Worker Routes
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = 'wrangler.v6.generated.json';
          const cfg = JSON.parse(fs.readFileSync(path, 'utf8'));
          cfg.routes ||= [];
          const remove = new Set([
            'picai.online',
            'picai.online/*',
            'www.picai.online',
            'www.picai.online/*'
          ]);
          cfg.routes = cfg.routes.filter((route) => {
            const pattern = typeof route === 'string' ? route : route?.pattern;
            return !remove.has(pattern);
          });
          cfg.routes.push(
            { pattern: 'picai.online/*', zone_id: 'e655c86fa8ded678787759daa263ac8e' },
            { pattern: 'www.picai.online/*', zone_id: 'e655c86fa8ded678787759daa263ac8e' }
          );
          fs.writeFileSync(path, JSON.stringify(cfg, null, 2));
          NODE

      - name: Deploy Worker routes
        run: npx wrangler deploy --config wrangler.v6.generated.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Verify HTTPS
        run: |
          set -euo pipefail
          for url in https://picai.online https://www.picai.online; do
            echo "=== $url ==="
            status="$(curl -sS -o /tmp/body -w '%{http_code}' --max-time 20 "$url")"
            echo "HTTP $status"
            if [ "$status" -ge 500 ]; then
              head -c 500 /tmp/body || true
              exit 1
            fi
          done
