name: Deploy www.picai.online

on:
  push:
    branches: [v20.1]
    paths:
      - '.github/workflows/deploy-picai.yml'
      - 'wrangler.jsonc'
      - 'worker-v6.ts'
      - 'app/**'
      - 'components/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: www-picai-online-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Provision shared Cloudflare resources
        run: node scripts/provision-v6-cloudflare.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Route www.picai.online through Worker
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = 'wrangler.v6.generated.json';
          const cfg = JSON.parse(fs.readFileSync(path, 'utf8'));
          cfg.routes ||= [];
          cfg.routes = cfg.routes.filter((route) => {
            const pattern = typeof route === 'string' ? route : route?.pattern;
            return pattern !== 'picai.online' &&
                   pattern !== 'picai.online/*' &&
                   pattern !== 'www.picai.online' &&
                   pattern !== 'www.picai.online/*';
          });
          cfg.routes.push({ pattern: 'www.picai.online/*' });
          fs.writeFileSync(path, JSON.stringify(cfg, null, 2));
          NODE

      - name: Deploy Worker route
        run: npx wrangler deploy --config wrangler.v6.generated.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
