name: Mobile v17

on:
  push:
    branches: [v17]
    paths:
      - 'apps/mobile/**'
      - 'packages/core/**'
      - '.github/workflows/mobile-v17.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sunodown-mobile-v17
  cancel-in-progress: true

jobs:
  expo-export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run export

  android-release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm install --no-audit --no-fund
      - run: npx expo prebuild --platform android --clean --no-install
      - name: Build standalone release APK with bundled JS
        run: ./gradlew assembleRelease
        working-directory: apps/mobile/android
      - name: Verify JS bundle is packaged in APK
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          unzip -l "$APK" | grep -E 'assets/(index\.android\.bundle|.*\.bundle)' >/dev/null
        working-directory: apps/mobile
      - uses: actions/upload-artifact@v4
        with:
          name: sunodown-mobile-v17-release-apk
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7

  ios-simulator:
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - run: npm install --no-audit --no-fund
      - run: npx expo prebuild --platform ios --clean --no-install
      - run: pod install
        working-directory: apps/mobile/ios
      - name: Build iOS simulator app
        run: |
          set -o pipefail
          xcodebuild             -workspace SunoDown.xcworkspace             -scheme SunoDown             -configuration Debug             -sdk iphonesimulator             -destination 'generic/platform=iOS Simulator'             CODE_SIGNING_ALLOWED=NO             build
        working-directory: apps/mobile/ios
