name: Deploy v24react Expo Web

on:
  push:
    branches: [v24react]
    paths:
      - 'expo/**'
      - 'wrangler.v24react.json'
      - '.github/workflows/deploy-v24react.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sunodown-v24react-production
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout v24react
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'

      - name: Install Expo dependencies
        working-directory: expo
        run: |
          npm install
          npx expo install --fix

      - name: Typecheck Expo app
        working-directory: expo
        run: npm run typecheck

      - name: Export Expo web
        working-directory: expo
        env:
          EXPO_PUBLIC_API_BASE: https://picai.online
        run: npm run build:web

      - name: Verify web export
        run: |
          test -f expo/dist/index.html
          test -d expo/dist/_expo

      - name: Deploy to Cloudflare Worker custom domain
        run: npx wrangler@4.92.0 deploy --config wrangler.v24react.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Smoke check production domain
        run: |
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --max-time 20 https://sunoapp.aiautotool.com/ -o /tmp/sunoapp.html; then
              grep -qi '<html' /tmp/sunoapp.html
              exit 0
            fi
            sleep 5
          done
          exit 1
