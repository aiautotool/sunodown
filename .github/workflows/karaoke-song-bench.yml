name: Karaoke Song Bench

on:
  push:
    branches: [v20.1-karaoke-bench]
    paths:
      - 'scripts/bench_karaoke_song.py'
      - '.github/workflows/karaoke-song-bench.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install benchmark dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests faster-whisper==1.2.0

      - name: Benchmark real Suno song against production backend
        env:
          SONG_URL: https://suno.com/s/tszo0jGdVUua4rT4
          BASE_URL: https://sunoapp.aiautotool.com
          BENCH_WHISPER_MODEL: small
          BENCH_LANGUAGE: vi
          MAX_EARLY_SECONDS: '0.45'
        run: python scripts/bench_karaoke_song.py

      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: karaoke-bench-tszo0jGdVUua4rT4
          path: |
            bench-result.json
            bench-report.md
          if-no-files-found: warn
          retention-days: 7
