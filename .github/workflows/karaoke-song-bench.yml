name: Karaoke Song Bench

on:
  push:
    branches: [v20.1-karaoke-bench]
    paths:
      - 'scripts/bench_karaoke_song.py'
      - 'scripts/bench_workers_ai_models.py'
      - 'scripts/bench_capcut_vs_local.py'
      - 'scripts/karaoke-ai-bench-worker.ts'
      - 'scripts/karaoke-ai-bench.wrangler.jsonc'
      - '.github/workflows/karaoke-song-bench.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Install benchmark dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests faster-whisper==1.2.0

      - name: Benchmark CapCut timing on the target Suno song
        env:
          SONG_URL: https://suno.com/s/tszo0jGdVUua4rT4
          BASE_URL: https://sunoapp.aiautotool.com
          BENCH_WHISPER_MODEL: medium
          BENCH_LANGUAGE: vi
        run: python scripts/bench_capcut_vs_local.py

      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: karaoke-bench-tszo0jGdVUua4rT4
          path: |
            bench-capcut.json
          if-no-files-found: warn
          retention-days: 7
