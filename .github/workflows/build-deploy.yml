name: Build SunoDown

on:
  push:
    branches: [main, v13, v17, v18]
  pull_request:
    branches: [main, v13, v17, v18]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sunodown-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Verify Worker entrypoint
        run: test -f dist/server/index.js

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: sunodown-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 7
