name: Deploy Cloudflare Worker

on:
  push:
    branches: [main, v2, v3, v4, v5, v6, v7, v8]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: suno-cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Provision background-render resources
        if: github.ref == 'refs/heads/v6' || github.ref == 'refs/heads/v7' || github.ref == 'refs/heads/v8'
        run: node scripts/provision-v6-cloudflare.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Deploy with background-render bindings
        if: github.ref == 'refs/heads/v6' || github.ref == 'refs/heads/v7' || github.ref == 'refs/heads/v8'
        run: npx wrangler deploy --config wrangler.v6.generated.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Deploy standard branches
        if: github.ref != 'refs/heads/v6' && github.ref != 'refs/heads/v7' && github.ref != 'refs/heads/v8'
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
