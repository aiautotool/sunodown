name: Deploy SunoDown to picai.online

on:
  push:
    branches: [v23, v24]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: sunodown-picai-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout deployment branch
        uses: actions/checkout@v4

      - name: Mark deploy pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=pending -f context=sunodown/picai-deploy -f description="Building ${GITHUB_REF_NAME} for picai.online"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run karaoke regression tests
        run: npm run test:karaoke

      - name: Build production bundle
        env:
          BUILD_VERSION: ${{ github.ref_name }}
        run: npm run build

      - name: Verify Worker entrypoint
        run: |
          test -f dist/server/index.js
          test -f worker-picai.js

      - name: Prepare picai.online Worker entrypoint
        run: cp worker-picai.js dist/server/worker-picai.js

      - name: Prepare CI config for existing picai.online route
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const cfg = JSON.parse(readFileSync('wrangler.picai.json', 'utf8'));
          // picai.online is already routed to sunodown-picai. CI only updates
          // that Worker script/assets, so the token does not need Zone Routes write.
          delete cfg.routes;
          writeFileSync('wrangler.picai.ci.json', JSON.stringify(cfg, null, 2));
          NODE

      - name: Deploy only to picai.online Worker
        run: npx wrangler deploy --config wrangler.picai.ci.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Sync Groq API key to Worker secret
        run: |
          if [ -n "$GROQ_API_KEY" ]; then
            printf '%s' "$GROQ_API_KEY" | npx wrangler secret put GROQ_API_KEY --config wrangler.picai.ci.json
          else
            echo "GROQ_API_KEY is not configured in GitHub Actions; keeping any existing Worker secret unchanged."
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      - name: Smoke check picai.online
        run: curl --fail --location --retry 5 --retry-delay 3 --max-time 20 https://picai.online/ >/dev/null

      - name: Verify Groq subtitle engine is available
        run: |
          response="$(curl --fail --silent --show-error --location --retry 5 --retry-delay 3 --max-time 20 https://picai.online/api/karaoke/groq)"
          echo "$response"
          echo "$response" | grep -Eq '"available"[[:space:]]*:[[:space:]]*true'

      - name: Verify Groq POST sees Worker secret
        run: |
          status="$(curl --silent --show-error --location --max-time 20 -o /tmp/groq-post.json -w '%{http_code}' -X POST -F 'probe=1' https://picai.online/api/karaoke/groq)"
          cat /tmp/groq-post.json
          test "$status" = "400"
          grep -Eq '"error"[[:space:]]*:[[:space:]]*"Thiếu audio' /tmp/groq-post.json

      - name: Verify v24 SubtitleStore binding
        if: github.ref_name == 'v24'
        run: |
          status="$(curl --silent --show-error -o /tmp/subtitle-store.json -w '%{http_code}' 'https://picai.online/api/music/subtitle?songId=00000000-0000-4000-8000-000000000000&language=vi')"
          cat /tmp/subtitle-store.json
          test "$status" = "404"
          grep -Eq '"status"[[:space:]]*:[[:space:]]*"missing"' /tmp/subtitle-store.json

      - name: Verify v24 subtitle cloud E2E
        if: github.ref_name == 'v24'
        run: |
          resolved="$(curl --fail --silent --show-error --max-time 45 \
            -X POST 'https://picai.online/api/resolve' \
            -H 'content-type: application/json' \
            --data '{"input":"https://suno.com/s/tszo0jGdVUua4rT4","metadataOnly":true}')"
          song_id="$(printf '%s' "$resolved" | jq -r '.id // empty')"
          test -n "$song_id"
          echo "Resolved song: $song_id"

          first="$(curl --fail --silent --show-error --max-time 210 \
            -X POST 'https://picai.online/api/music/subtitle/generate' \
            -H 'content-type: application/json' \
            --data "{\"songId\":\"$song_id\",\"language\":\"vi\"}")"
          printf '%s' "$first" | jq -e '.status == "ready"' >/dev/null
          printf '%s' "$first" | jq -e '.subtitle.lines | length > 0' >/dev/null
          printf '%s' "$first" | jq -e '.subtitle.rawWords | length > 0' >/dev/null

          second="$(curl --fail --silent --show-error --max-time 60 \
            -X POST 'https://picai.online/api/music/subtitle/generate' \
            -H 'content-type: application/json' \
            --data "{\"songId\":\"$song_id\",\"language\":\"vi\"}")"
          printf '%s' "$second" | jq -e '.status == "ready"' >/dev/null
          printf '%s' "$second" | jq -e '.cached == true' >/dev/null

      - name: Mark deploy success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context=sunodown/picai-deploy -f description="${GITHUB_REF_NAME} deployed to picai.online"

      - name: Mark deploy failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=failure -f context=sunodown/picai-deploy -f description="picai.online deploy failed"
