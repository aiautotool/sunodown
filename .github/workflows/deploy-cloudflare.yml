name: Deploy SunoDown to picai.online

on:
  push:
    branches: [v23]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: sunodown-picai-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout v23
        uses: actions/checkout@v4

      - name: Mark deploy pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=pending -f context=sunodown/picai-deploy -f description="Building v23 for picai.online"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run karaoke regression tests
        run: npm run test:karaoke

      - name: Build production bundle
        env:
          BUILD_VERSION: v23
        run: npm run build

      - name: Verify Worker entrypoint
        run: |
          test -f dist/server/index.js
          test -f worker-picai.js

      - name: Prepare picai.online Worker entrypoint
        run: cp worker-picai.js dist/server/worker-picai.js

      - name: Deploy only to picai.online
        run: npx wrangler deploy --config wrangler.picai.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Mark deploy success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context=sunodown/picai-deploy -f description="v23 deployed to picai.online"

      - name: Mark deploy failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=failure -f context=sunodown/picai-deploy -f description="picai.online deploy failed"
