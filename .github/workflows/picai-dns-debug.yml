name: Diagnose picai DNS authority

on:
  push:
    branches: [v20.1]
    paths:
      - '.github/workflows/picai-dns-debug.yml'
  workflow_dispatch:

jobs:
  dns:
    runs-on: ubuntu-latest
    steps:
      - name: Check authoritative DNS
        run: |
          set +e
          echo "=== NS ==="
          nslookup -type=NS picai.online 1.1.1.1
          nslookup -type=NS picai.online 8.8.8.8
          echo "=== SOA ==="
          nslookup -type=SOA picai.online 1.1.1.1
          echo "=== A/AAAA/CNAME ==="
          nslookup -type=A picai.online 1.1.1.1
          nslookup -type=AAAA picai.online 1.1.1.1
          nslookup -type=CNAME www.picai.online 1.1.1.1
          nslookup -type=A www.picai.online 1.1.1.1
          nslookup -type=AAAA www.picai.online 1.1.1.1
          echo "=== AUTHORITATIVE ==="
          for ns in chip.ns.cloudflare.com ophelia.ns.cloudflare.com; do
            echo "--- $ns root A ---"
            nslookup -type=A picai.online "$ns"
            echo "--- $ns root AAAA ---"
            nslookup -type=AAAA picai.online "$ns"
            echo "--- $ns www A ---"
            nslookup -type=A www.picai.online "$ns"
            echo "--- $ns www AAAA ---"
            nslookup -type=AAAA www.picai.online "$ns"
          done
          echo "=== HTTPS ==="
          for url in https://picai.online https://www.picai.online; do
            echo "--- $url ---"
            curl -sS -I --max-time 20 "$url" | sed -n '1,12p'
          done
