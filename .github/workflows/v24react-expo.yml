name: v24react Expo checks

on:
  push:
    branches: [v24react]
    paths:
      - 'expo/**'
      - '.github/workflows/v24react-expo.yml'
  workflow_dispatch:

concurrency:
  group: v24react-expo
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: expo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm install
      - run: npx expo install --fix
      - name: Enforce one UI source tree
        shell: bash
        run: |
          test ! -f App.native.tsx
          test ! -f App.ios.tsx
          test ! -f App.android.tsx
          test ! -f App.web.tsx
          ! grep -R "react-native-webview\|WebView" . --exclude-dir=node_modules --include='*.ts' --include='*.tsx' --include='package.json'
          ! grep -R "MobileStudioScreen" App.tsx src/StudioScreen.tsx
          echo "One App.tsx and one responsive StudioScreen for Web/iOS/Android."
      - run: npm run typecheck
      - run: npm run build:web
      - name: Validate Android native project generation
        run: npx expo prebuild --platform android --no-install
      - name: Build Android debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: sunodown-v24react-android-debug
          path: expo/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Validate iOS native project generation
        run: rm -rf android && npx expo prebuild --platform ios --no-install
