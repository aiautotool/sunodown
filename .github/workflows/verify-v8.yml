name: Verify v8 Build

on:
  pull_request:
    branches: [v8]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Provision Cloudflare resources for deploy verification
        if: startsWith(github.head_ref, 'deploy-v8-')
        run: node scripts/provision-v6-cloudflare.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Deploy verified v8 build
        if: startsWith(github.head_ref, 'deploy-v8-')
        run: npx wrangler deploy --config wrangler.v6.generated.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
