name: v24react visual parity

on:
  push:
    branches: [v24react]
    paths:
      - 'expo/**'
      - '.github/workflows/v24react-visual-parity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'

      - name: Install visual test tools
        run: |
          npm install --no-save playwright@1.56.1 pixelmatch@7.1.0 pngjs@7.0.0
          npx playwright install --with-deps chromium

      - name: Ensure v24 preview media signing is usable
        shell: bash
        run: |
          MEDIA_SECRET="${MEDIA_TOKEN_SECRET:-}"
          if [ -z "$MEDIA_SECRET" ]; then
            MEDIA_SECRET="$(openssl rand -hex 32)"
          fi
          echo "::add-mask::$MEDIA_SECRET"
          printf '%s' "$MEDIA_SECRET" | npx wrangler@4.92.0 secret put MEDIA_TOKEN_SECRET --name sunodown-picai-v24
          if [ -n "$GROQ_API_KEY" ]; then
            printf '%s' "$GROQ_API_KEY" | npx wrangler@4.92.0 secret put GROQ_API_KEY --name sunodown-picai-v24
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          MEDIA_TOKEN_SECRET: ${{ secrets.MEDIA_TOKEN_SECRET }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      - name: Verify v24 preview can enter Studio
        run: |
          body="$(curl --fail --silent --show-error --max-time 60             -X POST 'https://sunodown-picai-v24.long-wind-7153.workers.dev/api/resolve'             -H 'content-type: application/json'             --data '{"input":"https://suno.com/s/tszo0jGdVUua4rT4","metadataOnly":false}')"
          echo "$body" | jq -e '.id != null and .audio != null' >/dev/null

      - name: Wait for latest v24react UI deployment
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1440,height:1100}});
          let ready=false;
          for(let attempt=0;attempt<40;attempt++){
            try{
              await page.goto('https://sunoapp.aiautotool.com/',{waitUntil:'domcontentloaded',timeout:30000});
              await page.waitForTimeout(3200);
              ready=await page.getByText('Sad Lyrics Cinema',{exact:true}).isVisible().catch(()=>false);
              if(ready)break;
            }catch{}
            await page.waitForTimeout(3000);
          }
          await browser.close();
          if(!ready)process.exit(1);
          NODE

      - name: Capture parity matrix
        run: |
          mkdir -p visual-parity
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const sampleRate=44100,duration=8,channels=1,bits=16;
          const dataSize=sampleRate*duration*channels*(bits/8);
          const b=Buffer.alloc(44+dataSize);
          b.write('RIFF',0);b.writeUInt32LE(36+dataSize,4);b.write('WAVE',8);b.write('fmt ',12);
          b.writeUInt32LE(16,16);b.writeUInt16LE(1,20);b.writeUInt16LE(channels,22);
          b.writeUInt32LE(sampleRate,24);b.writeUInt32LE(sampleRate*channels*(bits/8),28);
          b.writeUInt16LE(channels*(bits/8),32);b.writeUInt16LE(bits,34);b.write('data',36);b.writeUInt32LE(dataSize,40);
          for(let i=0;i<sampleRate*duration;i++){
            const t=i/sampleRate;
            const amp=.16*Math.sin(2*Math.PI*(220+40*Math.sin(t*.9))*t)*(.55+.45*Math.sin(Math.PI*t/duration));
            b.writeInt16LE(Math.max(-32767,Math.min(32767,Math.round(amp*32767))),44+i*2);
          }
          fs.writeFileSync('visual-parity/parity-test.wav',b);
          NODE
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          import pixelmatch from 'pixelmatch';
          import { PNG } from 'pngjs';

          const OLD='https://sunodown-picai-v24.long-wind-7153.workers.dev';
          const NEW='https://sunoapp.aiautotool.com';

          async function load(page,url){
            await page.goto(url,{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForTimeout(3200);
          }
          async function shot(page,name){
            await page.screenshot({path:'visual-parity/'+name+'.png',fullPage:false});
          }
          async function clickText(page,text){
            const target=page.getByText(text,{exact:true}).first();
            await target.waitFor({state:'visible',timeout:15000});
            await target.click();
            await page.waitForTimeout(1000);
          }
          async function openLocalAudio(page){
            const file='visual-parity/parity-test.wav';
            const direct=page.locator('input[type="file"]').first();
            if(await direct.count()){
              await direct.setInputFiles(file);
            }else{
              const chooserPromise=page.waitForEvent('filechooser',{timeout:15000});
              await page.getByText('Tải file audio lên',{exact:true}).first().click();
              const chooser=await chooserPromise;
              await chooser.setFiles(file);
            }
            await page.waitForTimeout(3500);
          }
          async function home(browser,url,prefix,viewport){
            const page=await browser.newPage({viewport});
            await load(page,url);
            await shot(page,prefix+'-home');
            return page;
          }

          const browser=await chromium.launch({headless:true});

          // Desktop home + routed sections.
          for(const [url,prefix] of [[OLD,'v24-desktop'],[NEW,'v24react-desktop']]){
            const page=await home(browser,url,prefix,{width:1440,height:1100});
            await clickText(page,'Thư viện');
            await shot(page,prefix+'-library');
            await clickText(page,'Dự án');
            await shot(page,prefix+'-projects');
            await clickText(page,'Jobs');
            await shot(page,prefix+'-jobs');
            await page.close();
          }

          // Desktop Studio from the same default Suno link.
          for(const [url,prefix] of [[OLD,'v24-desktop'],[NEW,'v24react-desktop']]){
            const page=await browser.newPage({viewport:{width:1440,height:1100}});
            await load(page,url);
            await openLocalAudio(page);
            await shot(page,prefix+'-studio');
            await page.close();
          }

          // Mobile Home + Library + Studio.
          for(const [url,prefix] of [[OLD,'v24-mobile'],[NEW,'v24react-mobile']]){
            const page=await home(browser,url,prefix,{width:390,height:844});
            await clickText(page,'Library');
            await shot(page,prefix+'-library');
            await page.close();

            const studio=await browser.newPage({viewport:{width:390,height:844}});
            await load(studio,url);
            await openLocalAudio(studio);
            await shot(studio,prefix+'-studio');
            await studio.close();
          }

          await browser.close();

          function compare(aPath,bPath,outPath){
            const a=PNG.sync.read(fs.readFileSync(aPath));
            const b=PNG.sync.read(fs.readFileSync(bPath));
            if(a.width!==b.width||a.height!==b.height)throw new Error('Screenshot dimensions differ');
            const diff=new PNG({width:a.width,height:a.height});
            const pixels=pixelmatch(a.data,b.data,diff.data,a.width,a.height,{threshold:.16,includeAA:false});
            fs.writeFileSync(outPath,PNG.sync.write(diff));
            return Number((pixels/(a.width*a.height)*100).toFixed(2));
          }

          const pairs=[
            ['desktopHome','v24-desktop-home.png','v24react-desktop-home.png'],
            ['desktopLibrary','v24-desktop-library.png','v24react-desktop-library.png'],
            ['desktopProjects','v24-desktop-projects.png','v24react-desktop-projects.png'],
            ['desktopJobs','v24-desktop-jobs.png','v24react-desktop-jobs.png'],
            ['desktopStudio','v24-desktop-studio.png','v24react-desktop-studio.png'],
            ['mobileHome','v24-mobile-home.png','v24react-mobile-home.png'],
            ['mobileLibrary','v24-mobile-library.png','v24react-mobile-library.png'],
            ['mobileStudio','v24-mobile-studio.png','v24react-mobile-studio.png'],
          ];
          const report={};
          for(const [key,a,b] of pairs){
            report[key]=compare('visual-parity/'+a,'visual-parity/'+b,'visual-parity/diff-'+key+'.png');
            console.log(key+' pixel diff: '+report[key]+'%');
          }
          fs.writeFileSync('visual-parity/report.json',JSON.stringify(report,null,2));
          NODE

      - name: Upload parity screenshots
        uses: actions/upload-artifact@v4
        with:
          name: v24react-visual-parity
          path: visual-parity/
          retention-days: 7
