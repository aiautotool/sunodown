server {
    listen 203.24.89.20:80;
    server_name 203.24.89.20;
    client_max_body_size 29m;

    location = /api/karaoke/align {
        proxy_pass http://127.0.0.1:8011;
        proxy_read_timeout 600s;
        proxy_send_timeout 60s;
    }
    location = /health {
        proxy_pass http://127.0.0.1:8011;
    }
    location / { return 404; }
}
