services:
  karaoke-align:
    build:
      context: .
      dockerfile: Dockerfile.vps
    restart: unless-stopped
    ports:
      - "127.0.0.1:8011:8000"
    mem_limit: 512m
    memswap_limit: 1g
    cpus: 0.75
    environment:
      WHISPER_MODEL: ${WHISPER_MODEL:-tiny}
      KARAOKE_ALIGN_TOKEN: ${KARAOKE_ALIGN_TOKEN:?Set KARAOKE_ALIGN_TOKEN in .env}
    volumes:
      - whisper-cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 300s
      retries: 3
volumes:
  whisper-cache:
