services:
  renderer:
    build: .
    ports:
      - "8080:8080"
    environment:
      VIBES_META_SESSION: ${VIBES_META_SESSION:-}
      META_AI_COOKIES: ${META_AI_COOKIES:-}
      RENDER_SERVICE_TOKEN: ${RENDER_SERVICE_TOKEN:-change-me}
      MOCK_VIBES: ${MOCK_VIBES:-false}
    restart: unless-stopped
