limit_req_zone $binary_remote_addr zone=groq_requests:10m rate=6r/m;
server {
    listen 203.24.89.20:80;
    server_name groq.aiautotool.com;
    location /.well-known/acme-challenge/ { root /var/www/groq-acme; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 203.24.89.20:443 ssl;
    server_name groq.aiautotool.com;
    ssl_certificate /etc/letsencrypt/live/groq.aiautotool.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/groq.aiautotool.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 25m;
    location / {
        limit_req zone=groq_requests burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8021;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 200s;
        proxy_send_timeout 200s;
        proxy_request_buffering on;
    }
}
